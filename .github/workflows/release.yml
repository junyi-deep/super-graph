name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，例如 v0.1.6"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须符合 vMAJOR.MINOR.PATCH，例如 v0.1.6" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" && "$REQUESTED_VERSION" != "${{ github.ref_name }}" ]]; then
            echo "标签与发布版本不一致" >&2
            exit 1
          fi
          echo "value=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Test frontend
        run: npm test
        working-directory: web
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...

  frontend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-frontend
          path: internal/frontend/dist
          if-no-files-found: error
          retention-days: 1

  package:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: internal/frontend/dist
      - name: Build
        shell: bash
        run: |
          mkdir -p package
          suffix=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then suffix=".exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o "package/super-graph${suffix}" ./cmd/server
          cp README.md package/
      - name: Package
        shell: bash
        run: |
          name="super-graph-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd package && zip -9 -r "../${name}.zip" .)
          else
            tar -C package -czf "${name}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: super-graph-${{ matrix.goos }}-${{ matrix.goarch }}
          path: super-graph-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: super-graph-*
          path: release
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: release
        run: sha256sum super-graph-* > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Super Graph ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
